databases:
  - name: antarctic-ops-db
    plan: free
    databaseName: antarctic_ops
    user: antarctic_ops

services:
  - type: web
    name: antarctic-ops-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antarctic-ops-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: NCPOR_MAITRI_URL
        value: https://data.ncpor.res.in/maitri/live
      - key: NCPOR_BHARATI_URL
        value: https://data.ncpor.res.in/bharati/live
      - key: NCPOR_REFRESH_INTERVAL
        value: "600"
      - key: NCPOR_REQUEST_TIMEOUT
        value: "15"
      - key: WIND_SPEED_LIMIT_KNOTS
        value: "35"
      - key: TEMP_LOW_LIMIT_C
        value: "-35"
      - key: TEMP_HIGH_LIMIT_C
        value: "5"
      - key: CRITICAL_LOAD_MARGIN_KW
        value: "50"
      - key: FUEL_SAFETY_RESERVE_PERCENT
        value: "40"
      - key: FUEL_WARNING_BUFFER_PERCENT
        value: "10"
